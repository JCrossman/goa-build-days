name: Workshop QA

on:
  pull_request:
  workflow_dispatch:
    inputs:
      demonstrate_failure:
        description: Run the intentional workshop failure fixture
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WORKSHOP_QA_DEMONSTRATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.demonstrate_failure && 'true' || 'false' }}
    steps:
      - name: Check out the starter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Run Node checks
        id: node
        run: |
          mkdir -p artifacts/node
          npm test > artifacts/node/qa.tap 2>&1 || { cat artifacts/node/qa.tap; exit 1; }
          cat artifacts/node/qa.tap
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser checks
        id: browser
        run: npm run test:browser
      - name: Summarize the checks
        if: always()
        env:
          NODE_RESULT: ${{ steps.node.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          {
            echo "## Workshop QA"
            echo "- Node checks: ${NODE_RESULT:-not run}"
            echo "- Browser checks: ${BROWSER_RESULT:-not run}"
            echo "- Intentional failure selected: $WORKSHOP_QA_DEMONSTRATE_FAILURE"
            echo ""
            echo "The run conclusion is the QA result. An agentic review cannot change it."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workshop-qa-evidence
          path: |
            artifacts/node
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
